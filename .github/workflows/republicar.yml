# Pede ao GitHub Pages para republicar sempre que esta branch recebe um push.
# Pushes feitos por apps não disparam a publicação automática do Pages sozinhos.
name: Republicar Pages
on:
  push:
    branches: [gh-pages]
permissions:
  pages: write
jobs:
  republicar:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
